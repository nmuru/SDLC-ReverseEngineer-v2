<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>technology-architecture</title>

<style>
body {
    margin: 0;
    background: #f6f7f9;
    color: #1f2937;
    font-family: Arial, Helvetica, sans-serif;
}

main {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 28px;
    background: #fff;
    min-height: 100vh;
}

h1, h2, h3, h4, h5, h6 {
    line-height: 1.25;
    margin-top: 1.5em;
}

p, li {
    line-height: 1.6;
}

table {
    border-collapse: collapse;
    margin: 18px 0;
    width: 100%;
}

td {
    border: 1px solid #d1d5db;
    padding: 8px;
    text-align: left;
    vertical-align: top;
}

pre {
    background: #111827;
    color: #f9fafb;
    overflow: auto;
    padding: 16px;
    border-radius: 8px;
}

code {
    background: #eef0f3;
    padding: 2px 4px;
    border-radius: 3px;
}

pre code {
    background: transparent;
    padding: 0;
}

a {
    color: #2563eb;
}

.mermaid {
    overflow-x: auto;
    margin: 24px 0;
    padding: 12px;
}
</style>

<script type="module">
import mermaid from
    "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

mermaid.initialize({
    startOnLoad: true,
    securityLevel: "loose",
    theme: "default",
});
</script>

</head>

<body>
<main>
<p>User Safety: safe</p>
</main>
</body>
</html>
